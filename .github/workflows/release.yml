name: Release

# 推送 v* 版本的 tag 即自动触发 Release（如 git tag v1.2 && git push origin v1.2）
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux（含国产架构）
          - { goos: linux,     goarch: amd64 }
          - { goos: linux,     goarch: arm64 }
          - { goos: linux,     goarch: loong64 }   # 龙芯 LoongArch
          - { goos: linux,     goarch: riscv64 }   # RISC-V
          # Windows
          - { goos: windows,   goarch: amd64 }
          - { goos: windows,   goarch: arm64 }
          # macOS
          - { goos: darwin,    goarch: amd64 }
          - { goos: darwin,    goarch: arm64 }
          # BSD
          - { goos: freebsd,   goarch: amd64 }
          - { goos: freebsd,   goarch: arm64 }
          - { goos: openbsd,   goarch: amd64 }
          - { goos: openbsd,   goarch: arm64 }
          - { goos: netbsd,    goarch: amd64 }
          - { goos: netbsd,    goarch: arm64 }
          - { goos: dragonfly, goarch: amd64 }
          # Unix 商业系统
          - { goos: solaris,   goarch: amd64 }
          - { goos: illumos,   goarch: amd64 }
          - { goos: aix,       goarch: ppc64 }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          MIRROR: ${{ vars.NSNALI_MIRROR }}   # 可选：仓库变量，自建 IP 库镜像地址
          VERSION: ${{ github.ref_name }}      # 版本号直接取 tag 名
        run: |
          ext=""; [ "$GOOS" = windows ] && ext=".exe"
          out="nsnali-${VERSION}-${GOOS}-${GOARCH}${ext}"
          go build -trimpath -ldflags "-s -w -X main.selfMirror=${MIRROR}" -o "$out" .
          echo "OUT=$out" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 拉取完整历史和 tag，用于生成提交说明

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums & notes
        run: |
          cd dist && sha256sum nsnali-* > SHA256SUMS && cd ..
          # 上一个 tag 到当前 tag 之间的提交说明（标题行），去掉合并提交
          prev=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || true)  # HEAD^ 跳过当前 tag 所在提交
          range=${prev:+$prev..HEAD}
          git log $range --no-merges --pretty='- %s' > notes.md
          [ -s notes.md ] || git log -1 --pretty='- %s' > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: dist/*
